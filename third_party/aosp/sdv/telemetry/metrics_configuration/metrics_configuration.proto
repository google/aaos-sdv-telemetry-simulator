syntax = "proto3";

package google.sdv.telemetry;

import "google/protobuf/any.proto";
import "google/protobuf/descriptor.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "third_party/aosp/sdv/telemetry/metrics_configuration/expression.proto";

option java_multiple_files = true;

message MetricsConfig {
  // Required.
  // Universally unique configuration identifier.
  string uuid = 1;

  // Required.
  // Version number of the configuration. Must be more than 0.
  uint32 version = 2;

  // Optional.
  // Protobuf messages that are available in this Metrics Configuration.
  repeated google.protobuf.FileDescriptorProto descriptor_protos = 3;

  // Optional.
  // Triggers that are available in the Metrics Configuration.
  repeated Trigger triggers = 5;

  // Optional.
  // Sources that are available in the Metrics Configuration.
  repeated Source sources = 6;

  // Optional.
  // Expression nodes that are available in the Metrics Configuration.
  repeated Node expression_nodes = 7;

  // Optional.
  // Configurations of metrics reports that are to be generated.
  repeated MetricsReportConfig metrics_report_configs = 8;

  // Optional.
  // The name of the trigger that starts data collection.
  // If not set, data collection will start immediately after activation.
  string start_trigger_name = 9;

  // Optional.
  // The name of the trigger that stops data collection.
  // If stop trigger is set, start trigger must be set.
  string stop_trigger_name = 10;

  // Optional.
  // The name of the trigger that deactivates metrics configuration.
  string deactivate_trigger_name = 11;

  // Optional.
  // Specifies whether the aggregated values are reset (false) or retained (true) on stop trigger.
  bool retain_aggregations_on_stop = 12;
}

// Emits trigger events.
message Trigger {
  // Required.
  // The name of the trigger. Must be unique across all sources and triggers
  // in the Metrics Configuration. Must not be an empty string.
  string name = 1;

  oneof trigger_type {
    DataTrigger data_trigger = 2;
    PeriodicTrigger periodic_trigger = 3;
    ConditionalTrigger conditional_trigger = 4;
  }
}

// Listens to the source when it publishes a new message.
// The published message is stored in the activation context under source
// name and is available down the activation chain.
message DataTrigger {
  // Required.
  // The name of the source to listen to.
  string source_name = 1;
}

// Triggers periodically.
message PeriodicTrigger {
  // Required.
  // The interval between polls.
  google.protobuf.Duration interval = 1;

  // Optional.
  // The names of the triggers that specify when the periodic sequence should be started.
  //
  // A new parallel sequence is started any time any of these triggers fire.
  // If empty, the sequence is started once after periodic trigger's activation. This activation
  // takes place:
  // * immediately when the metrics configuration is activated and start trigger is not set,
  // * immediately when the metrics configuration is activated and start trigger is set, and start
  //   trigger is either this periodic trigger or it depends on this periodic trigger (possibly,
  //   transitively),
  // * after start trigger fires, otherwise.
  repeated string trigger_names = 2;

  // Optional.
  // The number of times to trigger.
  // If not set, the trigger fires until deactivated. If set, count must be positive.
  optional uint32 count = 3;
}

// Listens to other triggers, when they fire evaluates selector expression
// against the activation context and triggers if the returned value changes.
message ConditionalTrigger {
  // Required.
  // Underlying trigger names.
  repeated string trigger_names = 1;

  // Required.
  // The index of the root node of the expression that uses data from sources
  // and returns a value. If change_type is not ALL_CHANGES, the value must be of
  // numeric type or a boolean. If a message from a source is not present in
  // the activation context, the context will be populated with the latest
  // published message.
  optional uint32 selector_node_index = 2;

  // Options for edge detection.
  message EdgeOptions {
    // Optional.
    // Minimum duration the edge needs to hold.
    google.protobuf.Duration min_duration = 1;

    // Optional.
    // If true, then all values received during `min_duration` must be equal to
    // consider the edge as valid.
    bool require_exact = 2;
  }

  // Fires if the new value is greater than the previous value.
  message ConditionTypeRisingEdge {
    // Optional.
    EdgeOptions rising_options = 1;

    // Optional. If true, the very first selector expression evaluation will unconditionally make
    // this trigger fire. If true, edge options and initialize_node_index must not be set.
    bool fire_initial = 2;

    // Optional.
    // The index of the root node of the expression to be evaluated for the initialization of the
    // value used for comparisons. The evaluation takes place immediately when this conditional
    // trigger is activated, and, in particular, before any parent trigger fire events are being
    // processed.
    //
    // Set this field if you want to have the very first selector expression evaluation be compared
    // with the initial value. If not set, the initial value will be treated as None.
    //
    // Setting both `initialize_node_index` and `fire_initial` is not allowed.
    //
    // The expression must evaluate to a numeric or boolean type, which also has to be
    // comparison-compatible with the type of selector expression (i.e. booleans can't be compared
    // with numeric types).
    optional uint32 initialize_node_index = 3;
  }

  // Fires if the new value is less than the previous value.
  message ConditionTypeFallingEdge {
    // Optional.
    EdgeOptions falling_options = 1;

    // Optional. If true, the very first selector expression evaluation will unconditionally make
    // this trigger fire. If true, edge options and initialize_node_index must not be set.
    bool fire_initial = 2;

    // Optional.
    // The index of the root node of the expression to be evaluated for the initialization of the
    // value used for comparisons. The evaluation takes place immediately when this conditional
    // trigger is activated, and, in particular, before any parent trigger fire events are being
    // processed.
    //
    // Set this field if you want to have the very first selector expression evaluation be compared
    // with the initial value. If not set, the initial value will be treated as None.
    //
    // Setting both `initialize_node_index` and `fire_initial` is not allowed.
    //
    // The expression must evaluate to a numeric or boolean type, which also has to be
    // comparison-compatible with the type of selector expression (i.e. booleans can't be compared
    // with numeric types).
    optional uint32 initialize_node_index = 3;
  }

  // Fires if the new value is different from the previous value. If any
  // `EdgeOptions` are set, then only numeric and boolean values are supported,
  // otherwise all values types are supported.
  message ConditionTypeAllChanges {
    // Optional.
    EdgeOptions rising_options = 1;

    // Optional.
    EdgeOptions falling_options = 2;

    // Optional. If true, the very first selector expression evaluation will unconditionally make
    // this trigger fire. If true, edge options and initialize_node_index must not be set.
    bool fire_initial = 3;

    // Optional.
    // The index of the root node of the expression to be evaluated for the initialization of the
    // value used for comparisons. The evaluation takes place immediately when this conditional
    // trigger is activated, and, in particular, before any parent trigger fire events are being
    // processed.
    //
    // Set this field if you want to have the very first selector expression evaluation be compared
    // with the initial value. If not set, the initial value will be treated as None.
    //
    // Setting both `initialize_node_index` and `fire_initial` is not allowed.
    //
    // If any edge options are provided, the expression must evaluate to a numeric or boolean type,
    // which also has to be comparison-compatible with the type of selector expression (i.e.
    // booleans can't be compared with numeric types). If no edge options are provided, the type of
    // evaluation can be any.
    optional uint32 initialize_node_index = 4;
  }

  // Fires if the condition evaluates to true or a non-zero numeric value.
  message ConditionTypeIsTrue {}

  // Fires if the condition evaluates to false or a zero numeric value.
  message ConditionTypeIsFalse {}

  // Required.
  // Defines when conditional trigger should fire depending on the expression
  // evaluation result.
  oneof condition_type {
    ConditionTypeRisingEdge rising_edge = 3;
    ConditionTypeFallingEdge falling_edge = 4;
    ConditionTypeAllChanges all_changes = 5;

    ConditionTypeIsTrue is_true = 6;
    ConditionTypeIsFalse is_false = 7;
  }
}

// Publishes messages and stores the latest published message.
message Source {
  // Required.
  // The name of the source. Must be unique across all sources and
  // triggers in the Metrics Configuration. Must not be an empty string.
  string name = 1;

  oneof source_type {
    DataSource data_source = 2;
    Aggregator aggregator = 3;
  }
}

// Publishes messages from a customizable external service.
message DataSource {
  // Required.
  // Unique source identifier.
  string source_identifier = 1;

  // Defines connection behavior of Service Publisher.
  enum ConnectionType {
    // Connection type is not specified.
    // Maps to SUBSCRIPTION connection type.
    CONNECTION_TYPE_UNSPECIFIED = 0;

    // DataSource subscribes to the underlying service.
    SUBSCRIPTION = 1;

    // DataSource gets the latest published message on demand.
    // Data Triggers cannot listen to DataSources with connection type `ON_DEMAND`.
    ON_DEMAND = 2;
  }

  // Optional.
  // Connection behavior.
  ConnectionType connection_type = 2;

  // Optional.
  // Service-specific configuration.
  google.protobuf.Any configuration = 3;

  // Optional.
  //
  // Specifies the sub-sampling interval for new messages. If not specified or
  // 0, defaults to no sub-sampling. The maximum allowed value is 2^32
  // milliseconds. Values less than 0 are not allowed.
  //
  // Behaves differently depending on the `ConnectionType`:
  // - Subscription sources: Will only be notified of new messages with the
  //   provided interval. When more than one message arrived in the sub-sampling
  //   interval, all but the latest message are discarded.
  // - OnDemand sources: No effect.
  //
  // - TODO: b/373332101 - Not yet implemented for configurable publishers.
  // - TODO: b/373332617 - Not yet implemented for getter publishers.
  google.protobuf.Duration sub_sampling_interval = 4;

  // Optional.
  // Specifies whether to retrieve the last published message when subscribing to the service.
  // Only applicable to subscription connection type.
  bool fetch_last_message = 5;
}

// When triggered uses message builder to create a new message according
// to its underlying aggregated field assignments and publishes it.
message Aggregator {
  // Required.
  // The names of the triggers that specify when a new message is published.
  repeated string trigger_names = 1;

  // Optional.
  // Specifies whether the aggregated value is reset when the source data is
  // read into activation context.
  bool reset_on_get = 2;

  // Required.
  // Message builder that defines how published message is created.
  ProtoMessageBuilder message_builder = 3;
}

// Specifies when and how data is combined into a Metrics Report to be reported
// to the OEM application.
message MetricsReportConfig {
  // Required.
  // The name of the metrics report config.
  // Must not be an empty string.
  string name = 1;

  // Optional.
  // The names of the triggers that specify when the metrics report is
  // generated.
  repeated string trigger_names = 2;

  // Optional.
  // Specifies whether to send the report using the latest published messages
  // on Telemetry Service shutdown or when the data collection is stopped or
  // the metrics configuration is deactivated.
  bool report_incomplete = 3;

  // Required.
  // The message builder that creates a metrics report to the
  // OEM application. If a message from a source is not present in
  // the activation context, the context will be populated with the latest
  // published message.
  ProtoMessageBuilder message_builder = 4;

  // Optional.
  // Specifies whether to send an initial report when the corresponding
  // metrics config is activated. Default value is set to false
  bool report_initial = 5;
}

// Report message that is sent to the OEM application.
message MetricsReport {
  // Required.
  // Monotonously increasing report number in Metrics Configuration.
  // Starts from 1 and incremented by 1 for each new report.
  // Report numbers are reset after a power down (turn off), process restart
  // and Metrics Config deactivation.
  int32 report_number = 1;

  // Required.
  // Report generation timestamp.
  // Depending on system implementation details, the underlying clock time may go backwards.
  google.protobuf.Timestamp report_timestamp = 2;

  enum ReportReason {
    REPORT_TYPE_UNSPECIFIED = 0;
    // Report generated when related Metrics Report Config trigger fired.
    REGULAR = 1;
    // Report generated because the Telemetry Service was shutting down.
    INCOMPLETE_SHUTDOWN = 2;
    // Report generated because Metrics Configuration data collection stopped.
    INCOMPLETE_STOPPED = 3;
    // Report generated because Metrics Configuration data collection
    // was deactivated.
    INCOMPLETE_DEACTIVATED = 4;
    // Report generated because the report_initial flag was set to true
    INITIAL = 5;
  }

  // Required.
  // The reason the report was generated.
  ReportReason report_reason = 3;

  // Required.
  // UUID of Metrics Configuration that was used to generate the report.
  string metrics_config_uuid = 4;

  // Required.
  // The version of the Metrics Configuration that was used to generate the report.
  uint32 metrics_config_version = 5;

  // Required.
  // The name of the MetricsReportConfig that was used to generate the report.
  string report_config_name = 6;

  // Required.
  // Metrics Report data.
  google.protobuf.Any report_data = 7;

  // Required.
  // Metrics Configuration activation timestamp.
  // Depending on system implementation details, the underlying clock time may go backwards.
  google.protobuf.Timestamp config_activation_timestamp = 8;

  // Required.
  // Identifiers of errors occurred while generating the report.
  // Full error information is sent back with Misc Status Listener.
  repeated int64 error_ids = 9;

  // Required.
  // Unique Metrics Report identifier.
  string report_uuid = 10;
}

// Builds a protobuf message of some given type, where the content of the
// message is specified by the list of field assignments.
message ProtoMessageBuilder {
  // Required.
  // Fully qualified name of the protobuf message that is created by the builder.
  string message_type = 1;

  // Instruction on how to set a single field.
  message FieldAssignment {
    // Required.
    // The name of the protobuf message field to set.
    string field_name = 1;

    // Required.
    // Value of the field.
    oneof aggregated_field_value {
      NoAggregation no_aggregation = 2;
      VectorAggregation vector_aggregation = 3;
      MaxAggregation max_aggregation = 4;
      MinAggregation min_aggregation = 5;
      AvgAggregation avg_aggregation = 6;
      CountAggregation count_aggregation = 7;
      SumAggregation sum_aggregation = 8;
      StdDevAggregation std_dev_aggregation = 9;
      DeltaAggregation delta_aggregation = 10;
    }

    // No aggregation is performed. The expression node's latest
    // evaluation output will be used as the field value.
    message NoAggregation {
      optional uint32 expression_node_index = 1;
    }

    // Concatenation of node evaluation outputs into a vector.
    message VectorAggregation {
      optional uint32 expression_node_index = 1;

      // If unset, the vector will not be length-limited and will always grow in size.
      // If set, the max_length must have value greater than 0. It will make the vector
      // behave like a ring buffer, where the vector will contain the last N outputs from
      // the expression, dropping the oldest values if the vector exceeds max_length.
      optional uint32 max_length = 2;
    }

    // Maximum numeric value of past and current node output value.
    // Requires the expression node to evaluate to a numeric value.
    message MaxAggregation {
      optional uint32 expression_node_index = 1;
    }

    // Minimum numeric value of past and current node output value.
    message MinAggregation {
      optional uint32 expression_node_index = 1;
    }

    // Numeric average of all node output values.
    message AvgAggregation {
      optional uint32 expression_node_index = 1;
    }

    // Count is incremented by 1 every time the message is built.
    // The first value is 1 and increments from there.
    message CountAggregation {}

    // Numeric sum of all node output values.
    message SumAggregation {
      optional uint32 expression_node_index = 1;
    }

    // Numeric standard deviation of all node output values. The calculation is performed as running
    // standard deviation using Welford's algorithm.
    message StdDevAggregation {
      optional uint32 expression_node_index = 1;
    }

    // Numeric delta of node's output value to the previously seen node's output value.
    message DeltaAggregation {
      optional uint32 expression_node_index = 1;
    }
  }

  // Required.
  // Instructions on how to set the fields of the message.
  // Each field can have a different type of aggregation.
  repeated FieldAssignment field_assignments = 2;
}
