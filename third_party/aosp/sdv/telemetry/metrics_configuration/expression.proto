syntax = "proto3";

package google.sdv.telemetry;

option java_multiple_files = true;

// A generic node in the tree.
message Node {
  // A node is either a leaf node or a parent node of other nodes.
  oneof node_type {
    // Non-leaf node holding some value computed from its children.
    CombinationNode combination_node = 1;
    // Leaf node of constant value.
    ConstantLeafNode constant_leaf_node = 2;
    // Leaf node of field value from a protobuf message.
    FieldLeafNode field_leaf_node = 3;
    // Leaf node that calls a function
    FunctionLeafNode function_leaf_node = 4;
    // Message builder node that constructs a protobuf message in-place.
    MessageBuilderNode message_builder_node = 5;
  }
}

// Leaf node holding some constant value. It does not require any computation.
message ConstantLeafNode {
  oneof node_value {
    bool bool_value = 1;
    int32 int32_value = 2;
    int64 int64_value = 3;
    float float_value = 4;
    double double_value = 5;
  }
}

// Leaf node holding some value from a protobuf message.
message FieldLeafNode {
  // Identify the source of the protobuf message.
  // The name of the source defined in the Metrics Configuration that
  // in turn (through DataSource) could reference a topic. `source_name` must
  // be non-empty if `expression_node_index` is not set, and must be empty
  // if `expression_node_index` is set.
  string source_name = 1;

  // Select value from a message using field_names.
  // If a field is unset, none will be returned to the selector.
  // If an operation is done on an unset field, an error will be returned to
  // the selector.
  // Example usage:
  // * If getting the message itself, leave field_names empty.
  // * If getting the value MsgA.a, the field_names = ["a"].
  // * If getting the value MsgA.b.c.d, the field_names = ["b", "c", "d"].
  repeated string field_names = 2;

  // Identify the expression yielding a protobuf message, as an alternative
  // to `source_name`. If set, `source_name` must be empty.
  optional uint32 expression_node_index = 3;
}

// A combination node also holds some value, and the value is the result of some
// computation from the child nodes. A combination node with 2 leaf nodes as
// children is the smallest unit of predicate in an expression.
// Chaining combination nodes together can define more complicated expressions.
message CombinationNode {
  // Output: boolean
  // Type requirement: The left child and the right child must have compatible
  // types for comparison.
  enum RelationalOperator {
    // Universal operator, child nodes can be any type.
    EQ = 0;
    NOT_EQ = 1;
    // Child nodes must be numeric types.
    GT = 2;
    GT_OR_EQ = 3;
    LT = 4;
    LT_OR_EQ = 5;
    // Left child must be a list type (repeated fields), right child must be
    // singular.
    CONTAINS = 6;
    DOES_NOT_CONTAIN = 7;
    // Deprecated and no longer supported: corresponding behavior is supported by EQ
    ALL_EQ = 8 [deprecated = true];
  }

  // Output: boolean
  // Type requirement: child nodes must hold boolean values.
  enum LogicalOperator {
    AND = 0;
    OR = 1;
    XOR = 2;
    NOT = 3;
  }

  // Output: number
  // Type requirement: child nodes must hold numeric values.
  enum ArithmeticOperator {
    ADD = 0;
    SUBTRACT = 1;
    MULTIPLY = 2;
    DIVIDE = 3;
    // The modulo operator requires both operands to be integer types. The
    // operator is implemented in terms of truncated division:
    // ```
    // +8 mod +3 = +2
    // +8 mod -3 = +2
    // -8 mod +3 = -2
    // -8 mod -3 = -2
    // ```
    // The sign of the modulus is always the same as the sign of the dividend,
    // which, among others, matches the definition used in the ISO C99 standard.
    MODULO_TRUNC = 4;
    POWER = 5;
    // Arithmetic negation operator.
    UNARY_MINUS = 6;

    // Unary Operator
    // Output: the positive numeric value of the input numeric value.
    // Type requirement: only left child node must hold numeric value.
    // right child node should be none.
    // Examples:
    // * Absolute value of -2.7 is 2.7
    // * Absolute value of 2.7 is 2.7
    // * Absolute value of -1.0 is 1.0
    // * Absolute value of -1 is 1
    // * Absolute value of 0 is 0
    ABSOLUTE = 7;
  }

  // Unary operator.
  // Output: integer.
  // Type requirement: child node must hold a floating point value.
  enum RoundingOperator {
    // Output: the largest integer less than or equal to the input floating point.
    // Examples:
    // * 1.0 rounded down is 1
    // * 0.9 rounded down is 0
    // * -0.2 rounded down is -1
    FLOOR = 0;

    // Output: the nearest integer to the input floating point.
    // Examples:
    // * 1.0 rounded is 1
    // * 0.5 rounded is 1
    // * -0.5 rounded is -1
    ROUND = 1;

    // Output: the smallest integer greater than or equal to the input floating point.
    // Examples:
    // * 1.0 rounded up is 1
    // * 0.2 rounded up is 1
    // * -2.9 rounded up is -2
    CEIL = 2;
  }

  // Operators for list types.
  enum ListOperator {
    // Binary operator.
    // Output: an item of the list.
    // Type requirements: left operand must be a list and right operand must be an integer.
    // Examples (prefix notation):
    // * `subscript [3, 1, 4, 1, 5] 0` returns 3
    // * `subscript [3, 1, 4, 1, 5] 4` returns 5
    // * `subscript [3, 1, 4, 1, 5] (-1)` returns 5 (the last item)
    // * `subscript [3, 1, 4, 1, 5] (-3)` returns 4 (third last item)
    SUBSCRIPT = 0;

    // Unary operator.
    // Output: integer
    // Type requirements: the single operand must be a list
    // Examples (prefix notation):
    // * `length []` returns 0
    // * `length [3, 1, 4, 1, 5]` returns 5
    LENGTH = 1;
  }

  // Required.
  // Index of the left child Node in the repeated list of `expression_nodes`
  // in MetricsConfig.
  // Most operators are binary and form this relationship:
  //   [left child] <operator> [right child]
  // The optional annotation is to verify that the left_index is set, not some
  // default value of 0. The left_index should always be specified.
  optional uint32 left_index = 1;

  // Optional.
  // Index of the right child Node in the repeated list of `expression_nodes`
  // in MetricsConfig.
  // For unary operators, only the left child should be set. If the right child
  // is set, an error will be raised.
  optional uint32 right_index = 2;

  oneof operator {
    RelationalOperator relational_operator = 3;
    LogicalOperator logical_operator = 4;
    ArithmeticOperator arithmetic_operator = 5;
    RoundingOperator rounding_operator = 6;
    ListOperator list_operator = 7;
  }
}

// Leaf node that calls a function. The function may be impure and
// non-deterministic, i.e., it may return different values when called multiple
// times.
message FunctionLeafNode {
  oneof function_type {
    GetCurrentTimestampFunction get_current_timestamp = 1;
  }
}

// Returns a timestamp in microseconds based on the selected `time_source`.
message GetCurrentTimestampFunction {
  enum TimeSource {
    TIME_SOURCE_UNSPECIFIED = 0;

    // Read the timestamp as a UNIX timestamp in microseconds based on the
    // device's realtime clock. This clock source may not be monotonic and can
    // jump around when the system's clock is changed.
    REALTIME_CLOCK = 1;

    // Retrieves the amount of time since the device booted, including when it
    // was suspended.
    MONOTONIC_TIME_SINCE_BOOT = 2;

    // Retrieves the amount of time since the device booted or resumed from
    // suspend, whichever time is more recent.
    MONOTONIC_TIME_SINCE_BOOT_OR_RESUME = 3;
  }

  TimeSource time_source = 1;
}

// Message builder node that constructs a protobuf message in-place.
message MessageBuilderNode {
  // Required.
  // Fully qualified name of the protobuf message that is created by the builder.
  optional string message_type = 1;

  // Required.
  repeated FieldAssignment field_assignments = 2;

  message FieldAssignment {
    // Required.
    // The name of the protobuf message field to set.
    optional string field_name = 1;

    // Required.
    // The expression node index to use to set the field.
    optional uint32 expression_node_index = 2;
  }
}
