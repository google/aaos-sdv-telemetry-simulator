syntax = "proto3";

package google.sdv.telemetry;

import "google/protobuf/any.proto";
import "google/protobuf/descriptor.proto";
import "google/protobuf/duration.proto";

message SimulationPublisher {
  // Name the simulation publisher will be registered under.
  // Corresponds to ServicePublisher's service name in
  // metrics_configuration.proto.
  string service_name = 1;

  // File descriptor proto containing the message descriptor that specifies
  // the publisher's message format.
  repeated google.protobuf.FileDescriptorProto data_format_protos = 2;

  // Message name of the message descriptor in the file descriptor proto.
  // Must be declared in the file descriptor.
  string data_format_message_name = 3;

  // Object describing one set of data to publish. One data generator for a
  // subscription with no configuration and one data generator per configuration
  // object. A publisher simulating a data tunnel publisher will only have a
  // single data generator with no configuration object set. ONLY A SINGLE DATA
  // GENERATOR WITH NO CONFIGURATION SPECIFIED CURRENTLY SUPPORTED.
  repeated DataGenerator data_generators = 4;

  // The publishing strategy to use.
  PublishingStrategy publishing_strategy = 5;
}

message DataGenerator {
  // Configuration object that when passed to a subscription this data should be published for. If
  // not specified, this set of data will be published when the publisher receives a subscription
  // with no configuration object.
  google.protobuf.Any configuration = 1;

  // When data is looped, a subscription will publish data until the simulator shuts down.
  bool loop_data = 2;

  // Delay used for any data entry without a specified delay.
  google.protobuf.Duration default_delay = 3;

  oneof data_source {
    CSVFile csv_file = 5;
  }
}

// CSV file format is header row followed by one row per message that will be
// published. Header row needs contain "_delay_before_publishing" and one entry
// for each primitive message field. The entry for each message field must be
// parseable into the type specified in the message descriptor. Rows in the CSV
// file starting with # will be treated as comments and ignored. The format of
// the header fields is [message_field_name.]field_name where one
// message_field_name is specified for each level of nesting of the field in the
// original message descriptor.
message CSVFile {
  // File path on the vm.
  string file_path = 1;

  // Delimiter must be a single character.
  string delimiter = 2;
}

message PublishingStrategy {
  oneof type {
    ConfigurablePublisherRegistry configurable_publisher_registry = 1;
    SdvCommsDataTunnel sdv_comms_data_tunnel = 2;
    SdvCommsRpc sdv_comms_rpc = 3;
  }

  // The publisher uses Telemetry's Configurable Publisher Registry.
  message ConfigurablePublisherRegistry {}

  // The publisher uses SDV Comms Data Tunnel.
  message SdvCommsDataTunnel {
    uint32 message_count = 1;
    uint32 message_size = 2;
  }

  // The publisher uses SDV Comms RPC.
  message SdvCommsRpc {}
}
