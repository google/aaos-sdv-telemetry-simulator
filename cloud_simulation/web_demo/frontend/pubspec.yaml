dependencies:
  flutter:
    sdk: flutter
  cloud_firestore:
  firebase_storage:
  file_picker:
  http:
  cupertino_icons:
  firebase_core:
  firebase_auth: ^6.1.0
  google_sign_in: ^7.2.0
  googleapis: ^15.0.0
  googleapis_auth: ^2.0.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  logging: ^1.3.0
  flutter_secure_storage: ^9.2.4
  intl: ^0.20.2
  google_sign_in_web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config.json
