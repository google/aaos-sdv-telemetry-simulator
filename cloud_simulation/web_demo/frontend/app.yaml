runtime: python313

service: __ENVIRONMENT__

vpc_access_connector:
  name: "__VPC_ACCESS_CONNECTOR__"
  egress_setting: all-traffic

handlers:
- url: /(.*\.(html|js|css|json|ico|png|jpg|jpeg|gif|svg|woff|woff2|ttf|otf))$
  static_files: build/web/\1
  upload: build/web/.*
  http_headers:
    Cross-Origin-Opener-Policy: same-origin-allow-popups
    Cross-Origin-Embedder-Policy: unsafe-none
    Cross-Origin-Resource-Policy: cross-origin
    Content-Security-Policy: >-
      default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: blob:;

- url: /.*
  static_files: build/web/index.html
  upload: build/web/index.html
  http_headers:
    Cross-Origin-Opener-Policy: same-origin-allow-popups
    Cross-Origin-Embedder-Policy: unsafe-none
    Cross-Origin-Resource-Policy: cross-origin
    Content-Security-Policy: >-
      default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: blob:;
