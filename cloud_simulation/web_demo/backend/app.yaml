runtime: python313
entrypoint: gunicorn -b :$PORT main:app
service: backend-__ENVIRONMENT__

vpc_access_connector:
  name: "__VPC_ACCESS_CONNECTOR__"
  egress_setting: all-traffic

env_variables:
  CORS_ORIGIN: "__CORS_ORIGIN__"
  CLOUD_FUNCTION_SCHEDULE: "__CLOUD_FUNCTION_RECEIVE_REQUEST__"
  CLOUD_FUNCTION_DELETE: "__CLOUD_FUNCTION_DELETE__"
  BACKEND_URL: "https://backend-__ENVIRONMENT__-dot-__PROJECT_ID__.ey.r.appspot.com"
  OAUTH_CLIENT_ID: "__OAUTH_CLIENT_ID__"
  BUCKET_NAME: "__SIMULATION_FILES_BUCKET_NAME__"
  PROJECT_ID: "__PROJECT_ID__"

handlers:
- url: /.*  # Route all requests to the Python app
  secure: always  # Redirect requests to HTTPS
  script: auto
